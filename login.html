<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | My Website</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>
    <a href="index.html" class="site-logo">
        <img src="images/cnllogo.png.png" alt="CNL GROUP">
    </a>

    <div class="login-page">

        <div class="login-card">

            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Login to continue to your account</p>
            </div>

            <form>

                <div class="input-box">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>

                <div class="input-box">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>

                </div>

                <button type="submit" class="login-button">
                    Login
                </button>

            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button class="google-button" type="button">
                Continue with Google
            </button>

            <p class="signup">
                Don't have an account?
                <a href="#">Create Account</a>
            </p>

            <a href="index.html" class="back-home">
                ← Back to Home
            </a>

        </div>

    </div>
    <!-- CNL GROUP AI CHAT -->
    <div class="cnl-chat">

        <button class="chat-toggle" id="chatToggle" type="button">
        <span class="chat-icon">✦</span>
        <span class="chat-label">CNL AI</span>
    </button>

        <div class="chat-window" id="chatWindow">

            <div class="chat-header">
                <div>
                    <strong>CNL GROUP</strong>
                    <span>AI Assistant</span>
                </div>

                <button id="chatClose" type="button">×</button>
            </div>

            <div class="chat-messages" id="chatMessages">

                <div class="bot-message">
                    Hello! 👋 Welcome to CNL GROUP. How can I help you today?
                </div>

            </div>

            <div class="chat-input-area">

                <input type="text" id="chatInput" placeholder="Type your message..." autocomplete="off">

                <button id="chatSend" type="button">
                ➤
            </button>

            </div>

        </div>

    </div>
    <script src="script.js"></script>

</body>

</html>
